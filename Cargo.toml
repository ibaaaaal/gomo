[package]
name = "gomo"
version = "0.1.0"
edition = "2021"
authors = ["ibal"]
description = "A small study timer for Windows, built with Rust and Slint"
license = "MIT"
readme = "README.md"

[dependencies]
# software renderer: no GPU driver dependency, enough for a 350x590 window
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.9"
winresource = "0.1.34"

# keep build output small
[profile.dev]
debug = 1            # line tables only, keeps the .pdb small on Windows
incremental = false  # no incremental cache on disk

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
